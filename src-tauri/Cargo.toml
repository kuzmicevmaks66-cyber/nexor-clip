[package]
name = "nexor-clip"
version = "1.0.0"
description = "NEXOR CLIP — Desktop Video Production & Analytics Tool"
authors = ["NEXOR"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "nexor_clip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
url = "2"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false
debug = false

# Меньше места на диске при сборке зависимостей
[profile.release.build-override]
opt-level = 0
debug = false

[profile.dev]
debug = 0
